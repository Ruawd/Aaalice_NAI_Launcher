name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/ios-client
    tags:
      - "ios-v*"
    paths:
      - ".github/workflows/ios.yml"
      - "assets/**"
      - "fonts/**"
      - "ios/**"
      - "lib/**"
      - "scripts/package_ios_ipa.sh"
      - "pubspec.yaml"
      - "pubspec.lock"

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.2"

jobs:
  build-ios:
    name: Build unsigned iOS release
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Use CocoaPods for legacy native plugins
        run: flutter config --no-enable-swift-package-manager

      - name: Pull bundled databases
        run: |
          git lfs install
          git lfs pull --include="assets/databases/*.db"

      - name: Verify bundled databases
        run: |
          for file in assets/databases/tag_catalog.db assets/databases/cooccurrence.db; do
            test -f "$file"
            test "$(wc -c < "$file")" -ge 1024
            test "$(dd if="$file" bs=15 count=1 2>/dev/null)" = "SQLite format 3"
          done

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate sources
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Install iOS pods
        working-directory: ios
        run: pod install --repo-update

      - name: Analyze
        run: flutter analyze

      - name: Test NovelAI provider compatibility
        run: |
          flutter test test/core/constants/api_constants_test.dart
          flutter test test/data/datasources/remote/nai_auth_api_service_test.dart
          flutter test test/data/datasources/remote/nai_image_generation_api_service_test.dart

      - name: Build iOS app without Apple certificate
        run: flutter build ios --release --no-codesign

      - name: Package TrollStore IPA
        run: ./scripts/package_ios_ipa.sh

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NAI-Launcher-iOS-${{ github.sha }}
          path: dist/NAI_Launcher_iOS_*_TrollStore.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-diagnostics-${{ github.sha }}
          path: |
            build/ios/**/*.log
            ios/Flutter/ephemeral/Packages/FlutterGeneratedPluginSwiftPackage/Package.swift
          if-no-files-found: ignore
          retention-days: 7

  publish-ios:
    name: Publish tagged IPA
    if: startsWith(github.ref, 'refs/tags/ios-v')
    needs: build-ios
    runs-on: ubuntu-latest

    steps:
      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: NAI-Launcher-iOS-${{ github.sha }}
          path: dist

      - name: Create iOS prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.ipa \
            --repo "${GITHUB_REPOSITORY}" \
            --prerelease \
            --title "Aaalice NAI Launcher iOS ${GITHUB_REF_NAME#ios-v}" \
            --notes "iOS/TrollStore beta 7: fixes Sugar Cloud generations getting stuck by following the /generate task-event stream, sending its token in the provider JSON body, surfacing upstream failures immediately, enforcing a five-minute timeout, and avoiding duplicate retries. Also includes the beta 6 ffdkj dictionary fix and earlier mobile UI/gallery fixes."
